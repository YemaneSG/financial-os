[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-os"
version = "0.1.0"
description = "Financial OS — private receipt capture and structured financial data service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }

# ── Core runtime dependencies ─────────────────────────────────────────────────
dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",

    # Data validation and serialization
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # Database — ORM, migrations, async driver
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",

    # Cloud SQL connector (IAM auth, no long-lived password)
    "cloud-sql-python-connector[asyncpg]>=1.10,<2.0",

    # GCP managed services
    "google-cloud-storage>=2.16,<3.0",
    "google-cloud-tasks>=2.16,<3.0",
    "google-cloud-secret-manager>=2.20,<3.0",
    "google-cloud-logging>=3.10,<4.0",

    # Vertex AI extraction adapter
    "google-cloud-aiplatform>=1.55,<2.0",

    # Firebase Authentication token verification
    "firebase-admin>=6.5,<7.0",

    # HTTP client (async, for health checks and adapter calls)
    "httpx>=0.27,<1.0",

    # JSON Schema validation for extraction output
    "jsonschema>=4.22,<5.0",

    # Decimal arithmetic — never use float for money
    # Python's built-in decimal module is sufficient; no extra dep needed.

    # Observability
    "opentelemetry-sdk>=1.24,<2.0",
    "opentelemetry-exporter-gcp-trace>=1.6,<2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",           # TestClient for FastAPI
    "factory-boy>=3.3,<4.0",     # synthetic fixture factories

    # Type checking
    "mypy>=1.10,<2.0",
    "types-jsonschema>=4.22,<5.0",

    # Linting / formatting
    "ruff>=0.4,<1.0",

    # Secret / private-data scanning
    "detect-secrets>=1.5,<2.0",

    # Dependency vulnerability scanning
    "pip-audit>=2.7,<3.0",

    # Local Postgres (integration tests)
    "psycopg2-binary>=2.9,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_os"]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "ERA",  # eradicate (commented-out code)
]
ignore = [
    "ANN101",  # self annotation not required
    "ANN102",  # cls annotation not required
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]  # assertions and missing annotations OK in tests

# ── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: fast in-process tests with no external dependencies",
    "integration: tests requiring database, storage, or queue",
    "contract: provider contract tests (fake provider)",
    "e2e: end-to-end browser or device tests",
    "slow: tests that take more than 5 seconds",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/financial_os"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
