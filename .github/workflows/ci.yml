name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend: lint, type-check, unit + integration tests ───────────────────
  backend-lint:
    name: Backend lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy src apps/api alembic

  backend-test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short --strict-markers

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: financialos_test
          POSTGRES_USER: financialos
          POSTGRES_PASSWORD: test-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://financialos:test-only-not-production@localhost:5432/financialos_test
      ENVIRONMENT: test
      GCS_EVIDENCE_BUCKET: test-bucket
      OWNER_ALLOWLIST: "google:test-subject-id"
      SESSION_VERSION: "1"
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations on ephemeral DB
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://financialos:test-only-not-production@localhost:5432/financialos_test

      - name: Verify migration reversibility
        run: alembic downgrade -1 && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://financialos:test-only-not-production@localhost:5432/financialos_test

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short --strict-markers

  backend-contract:
    name: Backend contract tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run contract tests (extraction schema, OpenAPI)
        run: pytest tests/contract -v --tb=short --strict-markers

  # ── Frontend: lint, type-check, unit tests ────────────────────────────────
  frontend-lint:
    name: Frontend lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm type-check

      - name: ESLint
        run: pnpm lint

  frontend-test:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test -- --reporter=verbose

  # ── Security: dependency scan + secret detection ──────────────────────────
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade "pip>=26.1.2,<27"
          pip install -e ".[dev]" pip-audit

      - name: Python dependency audit
        run: pip-audit --local

      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  secret-scan:
    name: Secret and private-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for private-data patterns
        run: bash scripts/check-private-data.sh

  # ── Infrastructure: Terraform validate ───────────────────────────────────
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform init (modules only, no backend)
        run: terraform init -backend=false
        working-directory: infra/environments/dev

      - name: Terraform validate
        run: terraform validate
        working-directory: infra/environments/dev

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: infra

  # ── OpenAPI: contract lint ────────────────────────────────────────────────
  openapi-lint:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate OpenAPI contract
        uses: swaggerhub-wap/openapi-spec-validator-action@v1.1.0
        with:
          openapi-spec: contracts/openapi.yaml

  # ── Container: build (no push on PRs) ────────────────────────────────────
  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-integration
      - backend-contract
      - frontend-test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: financial-os:ci-${{ github.sha }}

  # ── Required check gate ───────────────────────────────────────────────────
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-test
      - backend-integration
      - backend-contract
      - frontend-lint
      - frontend-test
      - dependency-scan
      - secret-scan
      - terraform-validate
      - openapi-lint
      - container-build
    steps:
      - run: echo "All CI checks passed."
